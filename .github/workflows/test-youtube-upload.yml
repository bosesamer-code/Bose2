name: test-youtube-upload

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: "I authorize uploading exactly one private test video to the verified target channel"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  test-upload:
    if: ${{ inputs.confirm_upload == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find latest successful production run with valid artifact
        id: resolve
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          repo = os.environ["GITHUB_REPOSITORY"]
          workflow_path = ".github/workflows/production-artifact.yml"

          def gh_json(*args):
              result = subprocess.run(["gh", "api", *args], text=True, capture_output=True)
              if result.returncode:
                  print(result.stderr, file=sys.stderr)
                  raise SystemExit("GitHub API request failed while resolving the production artifact.")
              return json.loads(result.stdout)

          # GitHub emits one JSON-encoded run per line through --jq.
          result = subprocess.run(
              ["gh", "api", "--paginate", "--jq", ".workflow_runs[] | @json",
               f"repos/{repo}/actions/workflows/production-artifact.yml/runs?branch=main&status=success&per_page=100"],
              text=True, capture_output=True,
          )
          if result.returncode:
              print(result.stderr, file=sys.stderr)
              raise SystemExit("Could not list production-artifact runs on main.")

          candidates = []
          for line in result.stdout.splitlines():
              try:
                  run = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (run.get("name") == "production-artifact"
                  and run.get("path") == workflow_path
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("event") != "pull_request"):
                  candidates.append(run)

          # Runs are newest first. Require the exact, unexpired artifact before selecting.
          for run in candidates:
              run_id = int(run["id"])
              artifacts = gh_json(f"repos/{repo}/actions/runs/{run_id}/artifacts")
              expected_name = f"queued-production-{run_id}"
              if any(a.get("name") == expected_name and not a.get("expired", False)
                     and a.get("size_in_bytes", 0) > 0 for a in artifacts.get("artifacts", [])):
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"production_run_id={run_id}\n")
                  print(f"Selected successful production run {run_id} with artifact {expected_name}.")
                  break
          else:
              raise SystemExit(
                  "No successful production-artifact run on main has a matching, unexpired "
                  "queued-production artifact. Run the production-artifact workflow successfully first."
              )
          PY
      - name: Install YouTube publishing client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Download production artifact
        uses: actions/download-artifact@v5
        with:
          name: queued-production-${{ steps.resolve.outputs.production_run_id }}
          path: published-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.production_run_id }}
      - name: Validate packages and select one test video
        id: select
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packages = sorted(Path("published-input/production").glob("*/publishing_package.json"))
          if not packages:
              raise SystemExit("No production packages found.")

          errors = []
          valid = []
          for package in packages:
              video = package.parent / "video" / "video.mp4"
              try:
                  metadata = json.loads(package.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{package}: invalid JSON ({exc})")
                  continue
              if not video.is_file() or video.stat().st_size == 0:
                  errors.append(f"{video}: missing or empty")
                  continue
              if not isinstance(metadata.get("title"), str) or not metadata["title"].strip():
                  errors.append(f"{package}: missing title")
                  continue
              if not isinstance(metadata.get("description"), str) or not metadata["description"].strip():
                  errors.append(f"{package}: missing description")
                  continue
              valid.append(package)
          if errors:
              print("\n".join(errors))
              raise SystemExit("Package validation failed.")
          selected = next((p for p in valid if "crochet_basics" in str(p)), valid[0])
          video = selected.parent / "video" / "video.mp4"
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package={selected}\n")
              output.write(f"video={video}\n")
          print(f"Selected one test video: {selected.parent.name}")
          PY
      - name: Upload exactly one test video to verified channel as private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_HANDLE: handmade.secrets
          YOUTUBE_PRIVACY_STATUS: private
          YOUTUBE_UPLOAD_CONFIRMATION: UPLOAD_ONE_PRIVATE_TEST_VIDEO
        run: |
          set -euo pipefail
          python scripts/publish_youtube.py "${{ steps.select.outputs.video }}" "${{ steps.select.outputs.package }}"
