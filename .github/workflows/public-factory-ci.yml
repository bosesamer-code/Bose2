name: public-factory-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest edge-tts
      - name: Install free media dependency
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Validate optional GPU trial notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('notebooks/free_gpu_cogvideox_trial.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          assert notebook.get('nbformat') == 4, 'Notebook must use nbformat 4'
          cells = notebook.get('cells', [])
          assert cells and all(cell.get('cell_type') in {'markdown', 'code'} for cell in cells)
          code = '\\n'.join(''.join(cell.get('source', [])) for cell in cells if cell.get('cell_type') == 'code')
          for required in ('torch.cuda.is_available()', 'CogVideoXPipeline', 'export_to_video', 'files.download'):
              assert required in code, f'Missing required notebook step: {required}'
          assert all(not cell.get('outputs') for cell in cells if cell.get('cell_type') == 'code'), 'Do not commit generated notebook outputs'
          print(f'Validated {path}: {len(cells)} cells')
          PY
      - name: Test
        run: python -m pytest -q
      - name: Secret filename check
        shell: bash
        run: |
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" \) -not -path "./.git/*" | grep -q .; then
            echo "Potential secret file found."
            exit 1
          fi
