name: public-factory-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q
      - name: Secret filename check
        shell: bash
        run: |
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" \) -not -path "./.git/*" | grep -q .; then
            echo "Potential secret file found."
            exit 1
          fi
