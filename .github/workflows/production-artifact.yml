name: production-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run factory production test
        run: |
          python -m pytest -q tests/test_free_factory.py
      - name: Package production evidence
        run: |
          mkdir -p production-evidence
          printf '%s\n' "Production factory smoke evidence" > production-evidence/README.txt
          printf '%s\n' "Commit: $GITHUB_SHA" >> production-evidence/README.txt
          printf '%s\n' "Factory test: passed" >> production-evidence/README.txt
      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence
          path: production-evidence/
