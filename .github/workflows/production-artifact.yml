name: production-artifact

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest edge-tts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - name: Run regression tests
        run: python -m pytest -q
      - name: Cloudflare image smoke test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MAX_IMAGES_PER_JOB: "1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "SKIP: Cloudflare secrets are not both configured; no external request was sent."
            exit 0
          fi
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from src.cloudflare_image_provider import CloudflareWorkersAIImageProvider
          from src.media_providers import MediaRequest

          with tempfile.TemporaryDirectory(prefix="cloudflare-smoke-") as temp:
              result = CloudflareWorkersAIImageProvider().generate(
                  MediaRequest(
                      "cloudflare-smoke-test",
                      Path(temp),
                      {"scene_plan": [{"scene": 1, "purpose": "lesson", "text": "crochet yarn and hook on a clean craft table"}]},
                  )
              )
              if result.status != "completed" or len(result.artifacts) != 1:
                  print("Cloudflare image smoke test:", result.status, result.error or "no image returned")
                  raise SystemExit(1)
              image = Path(result.artifacts[0])
              if not image.is_file() or image.stat().st_size < 100:
                  raise SystemExit("Cloudflare returned an empty or invalid image artifact.")
              print("PASS: Cloudflare Workers AI returned one image; credentials were not printed.")
          PY
      - name: Generate production queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ENABLE_IMAGE_GENERATION: ${{ vars.CLOUDFLARE_ENABLE_IMAGE_GENERATION }}
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from src.content_engine import generate_lesson, load_catalog, validate_lesson
          from src.gemini_script_enhancer import enhance_lesson_with_gemini

          catalog = load_catalog(Path("content/content_catalog.json"))
          day = date.today().isoformat()
          queue = []
          for topic in catalog.get("topics", []):
              ideas = topic.get("ideas", [])
              if not ideas:
                  continue
              index = date.today().toordinal() % len(ideas)
              lesson = generate_lesson(catalog, topic["topic_id"], index)
              lesson = enhance_lesson_with_gemini(lesson)
              lesson["content_id"] = f"{lesson['content_id']}-{day}"
              lesson["title"] = f"{lesson['title']} — {day}"
              validate_lesson(lesson)
              queue.append(lesson)

          Path("production-queue.json").write_text(
              json.dumps(queue, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("Generated", len(queue), "production jobs for", day)
          PY
      - name: Validate content engine
        run: python -m pytest -q tests/test_content_engine.py tests/test_content_queue.py
      - name: Produce and validate queued lessons
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.free_factory import run_free_factory

          queue = json.loads(Path("production-queue.json").read_text(encoding="utf-8"))
          root = Path("production")
          evidence = []

          for content in queue:
              manifest = {
                  "task_id": content["content_id"],
                  "scene_plan": content["scenes"],
                  "inputs": {
                      "script": content["script"],
                      "production_goal": content["title"],
                      "language": content["language"],
                      "visual_style": content["visual_style"],
                  },
              }
              job_root = root / content["content_id"]
              job_root.mkdir(parents=True, exist_ok=True)
              duration = sum(int(scene["duration_seconds"]) for scene in content["scenes"])

              package = {
                  "content_id": content["content_id"],
                  "title": content["title"],
                  "description": content["script"],
                  "language": content["language"],
                  "format": content["video_format"],
                  "duration_planned_seconds": duration,
                  "scenes": content["scenes"],
                  "destinations": ["facebook", "youtube"],
                  "approval": {"required": True, "approved": False},
                  "automatic_publish": False,
                  "owner_controlled": True,
                  "artifact": "production/" + content["content_id"] + "/video/video.mp4",
              }
              (job_root / "publishing_package.json").write_text(
                  json.dumps(package, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              result = run_free_factory(manifest, root)
              (job_root / "result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              validation = result["production"]["validation"]
              if validation["status"] != "valid":
                  providers = result["production"].get("providers", [])
                  details = {
                      "content_id": content["content_id"],
                      "validation": validation,
                      "production_status": result["production"].get("status"),
                      "providers": [
                          {
                              "provider": item.get("provider"),
                              "media_type": item.get("media_type"),
                              "status": item.get("status"),
                              "error": item.get("error"),
                              "artifacts_count": len(item.get("artifacts", [])),
                          }
                          for item in providers
                      ],
                  }
                  print("PRODUCTION_VALIDATION_DIAGNOSTICS=" + json.dumps(details, ensure_ascii=False))
                  raise SystemExit(content["content_id"] + ": validation failed; see structured diagnostics above")
              if not result["production"]["publish_ready"]:
                  print("PRODUCTION_NOT_READY=" + json.dumps({
                      "content_id": content["content_id"],
                      "production": result["production"],
                  }, ensure_ascii=False))
                  raise SystemExit(content["content_id"] + ": not publish-ready; see diagnostics above")
              evidence.append({
                  "content_id": content["content_id"],
                  "duration_planned_seconds": duration,
                  "media_validation_passed": True,
                  "human_approval_required": True,
                  "human_approved": False,
                  "publish_ready": False,
                  "automatic_publish": False,
              })

          Path("production-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
      - name: Verify every generated MP4, spoken audio, and captions
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          from pathlib import Path

          def probe(path):
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_streams", "-show_format",
                   "-of", "json", str(path)],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode:
                  raise SystemExit("ffprobe failed for " + str(path) + ": " + result.stderr)
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit("Invalid ffprobe JSON for " + str(path)) from exc

          queue = json.loads(Path("production-queue.json").read_text(encoding="utf-8"))
          for content in queue:
              root = Path("production") / content["content_id"]
              video = root / "video" / "video.mp4"
              audio = root / "audio" / "voice.mp3"
              subtitles = root / "video" / "scene_subtitles.srt"
              images = sorted((root / "images").glob("scene_*.ppm"))
              if len(images) != len(content["scenes"]):
                  raise SystemExit("Scene image count mismatch: " + content["content_id"])
              for path, label in ((audio, "spoken audio"), (video, "MP4"), (subtitles, "captions")):
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit("Missing or empty " + label + ": " + str(path))

              video_info = probe(video)
              streams = video_info.get("streams", [])
              video_streams = [s for s in streams if s.get("codec_type") == "video"]
              audio_streams = [s for s in streams if s.get("codec_type") == "audio"]
              if len(video_streams) != 1 or len(audio_streams) != 1:
                  raise SystemExit("MP4 must contain exactly one video and one audio stream: " + str(video))
              v = video_streams[0]
              if (v.get("width"), v.get("height")) != (1920, 1080):
                  raise SystemExit("Unexpected resolution in " + str(video))
              fps = v.get("avg_frame_rate", "0/1")
              numerator, denominator = (int(x) for x in fps.split("/"))
              if denominator == 0 or abs(numerator / denominator - 25.0) > 0.01:
                  raise SystemExit("Expected 25 fps in " + str(video))
              try:
                  video_duration = float(video_info["format"]["duration"])
                  audio_duration = float(probe(audio)["format"]["duration"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit("Missing media duration for " + content["content_id"]) from exc
              planned_duration = sum(int(scene["duration_seconds"]) for scene in content["scenes"])
              expected_duration = max(planned_duration, math.ceil(audio_duration))
              if abs(video_duration - expected_duration) > 1.25:
                  raise SystemExit(
                      f"Video duration mismatch for {content['content_id']}: "
                      f"{video_duration:.2f}s vs expected {expected_duration}s "
                      f"(planned {planned_duration}s, narration {audio_duration:.2f}s)"
                  )
              if audio_duration < 1 or audio_duration > expected_duration + 0.25:
                  raise SystemExit("Unexpected narration duration for " + content["content_id"])

              audio_check = subprocess.run(
                  ["ffmpeg", "-hide_banner", "-i", str(video), "-vn", "-af", "volumedetect",
                   "-f", "null", "-"],
                  capture_output=True, text=True, check=False,
              )
              volume_text = audio_check.stderr
              if audio_check.returncode != 0 or "mean_volume: -inf dB" in volume_text:
                  raise SystemExit("Audio missing or silent in MP4: " + str(video))
              caption_text = subtitles.read_text(encoding="utf-8").strip()
              if "-->" not in caption_text or not any(ch.isalpha() for ch in caption_text):
                  raise SystemExit("Caption file has no timed text: " + str(subtitles))
              print(
                  f"PASS {content['content_id']}: {v['width']}x{v['height']} "
                  f"{fps}fps, {video_duration:.2f}s, audio {audio_duration:.2f}s, captions present"
              )
          PY
      - name: Write production evidence
        run: |
          mkdir -p production-evidence
          printf '%s\n' "Queued handmade production evidence" > production-evidence/README.txt
          printf '%s\n' "Commit: $GITHUB_SHA" >> production-evidence/README.txt
          printf '%s\n' "Jobs: $(python -c 'import json; print(len(json.load(open("production-evidence.json", encoding="utf-8"))))')" >> production-evidence/README.txt
          printf '%s\n' "Publishing: disabled in production workflow; human review and separate explicit upload authorization required" >> production-evidence/README.txt
      - name: Upload queued production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: queued-production-${{ github.run_id }}
          path: |
            production/
            production-queue.json
            production-evidence.json
            production-evidence/
          if-no-files-found: error
