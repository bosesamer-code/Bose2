name: production-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run regression tests
        run: python -m pytest -q
      - name: Generate production queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.content_engine import generate_queue, load_catalog
          catalog = load_catalog(Path("content/content_catalog.json"))
          queue = generate_queue(catalog, [
              ("crochet_basics", 0),
              ("handmade_home", 0),
              ("handmade_business", 0),
          ])
          Path("production-queue.json").write_text(
              json.dumps(queue, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("Generated", len(queue), "production jobs.")
          PY
      - name: Validate content engine
        run: python -m pytest -q tests/test_content_engine.py tests/test_content_queue.py
      - name: Produce and validate queued lessons
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.free_factory import run_free_factory

          queue = json.loads(Path("production-queue.json").read_text(encoding="utf-8"))
          root = Path("production")
          evidence = []

          for content in queue:
              manifest = {
                  "task_id": content["content_id"],
                  "scene_plan": content["scenes"],
                  "inputs": {
                      "script": content["script"],
                      "production_goal": content["title"],
                      "language": content["language"],
                      "visual_style": content["visual_style"],
                  },
              }
              job_root = root / content["content_id"]
              job_root.mkdir(parents=True, exist_ok=True)
              duration = sum(int(scene["duration_seconds"]) for scene in content["scenes"])

              package = {
                  "content_id": content["content_id"],
                  "title": content["title"],
                  "description": content["script"],
                  "language": content["language"],
                  "format": content["video_format"],
                  "duration_planned_seconds": duration,
                  "scenes": content["scenes"],
                  "destinations": ["facebook", "youtube"],
                  "approval": {"required": True, "approved": False},
                  "automatic_publish": False,
                  "artifact": "production/" + content["content_id"] + "/video/video.mp4",
              }
              (job_root / "publishing_package.json").write_text(
                  json.dumps(package, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              result = run_free_factory(manifest, root)
              (job_root / "result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              validation = result["production"]["validation"]
              gate = result["publishing_gate"]
              if validation["status"] != "valid":
                  raise SystemExit(content["content_id"] + ": validation failed")
              if not result["production"]["publish_ready"]:
                  raise SystemExit(content["content_id"] + ": not publish-ready")
              if gate["publish_allowed"] or gate["reason"] != "human_approval_required":
                  raise SystemExit(content["content_id"] + ": human publishing gate violated")
              evidence.append({
                  "content_id": content["content_id"],
                  "duration_planned_seconds": duration,
                  "publish_ready": True,
                  "automatic_publish": False,
              })

          Path("production-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
      - name: Verify every generated MP4
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          queue = json.loads(Path("production-queue.json").read_text(encoding="utf-8"))
          for content in queue:
              video = Path("production") / content["content_id"] / "video" / "video.mp4"
              if not video.is_file() or video.stat().st_size == 0:
                  raise SystemExit("Missing video: " + str(video))
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=format_name,duration",
                   "-of", "default=noprint_wrappers=1", str(video)],
                  capture_output=True, text=True, check=False,
              )
              if probe.returncode != 0 or not probe.stdout.strip():
                  raise SystemExit("ffprobe failed: " + str(video))
              print(video, probe.stdout.strip())
          PY
      - name: Write production evidence
        run: |
          mkdir -p production-evidence
          printf '%s\n' "Queued handmade production evidence" > production-evidence/README.txt
          printf '%s\n' "Commit: $GITHUB_SHA" >> production-evidence/README.txt
          printf '%s\n' "Jobs: 3" >> production-evidence/README.txt
          printf '%s\n' "Publishing: blocked until explicit human approval" >> production-evidence/README.txt
      - name: Upload queued production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: queued-production-${{ github.run_id }}
          path: |
            production/
            production-queue.json
            production-evidence.json
            production-evidence/
          if-no-files-found: error
