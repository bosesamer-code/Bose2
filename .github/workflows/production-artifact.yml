name: production-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run regression tests
        run: |
          python -m pytest -q

      - name: Build production manifest from real content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("content/handmade_lesson_001.json").read_text(encoding="utf-8"))
          required = ["content_id", "title", "script", "scenes", "video_format", "human_approval_required"]
          missing = [key for key in required if key not in source]
          if missing:
              raise SystemExit(f"Content manifest missing: {', '.join(missing)}")
          if source["human_approval_required"] is not True:
              raise SystemExit("Human approval must remain mandatory.")

          manifest = {
              "task_id": source["content_id"],
              "scene_plan": source["scenes"],
              "inputs": {
                  "script": source["script"],
                  "production_goal": source["title"],
                  "language": source["language"],
                  "visual_style": source["visual_style"],
              },
          }
          Path("production-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Validate content engine
        run: |
          python -m pytest -q tests/test_content_engine.py

      - name: Create scene and publishing package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("content/handmade_lesson_001.json").read_text(encoding="utf-8"))
          scenes = source["scenes"]
          total = sum(int(scene["duration_seconds"]) for scene in scenes)

          Path("production-manifest.json").write_text(
              json.dumps({
                  "task_id": source["content_id"],
                  "scene_plan": scenes,
                  "inputs": {
                      "script": source["script"],
                      "production_goal": source["title"],
                      "language": source["language"],
                      "visual_style": source["visual_style"]
                  }
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          package = {
              "content_id": source["content_id"],
              "title": source["title"],
              "description": source["script"],
              "language": source["language"],
              "format": source["video_format"],
              "duration_planned_seconds": total,
              "scenes": scenes,
              "destinations": ["facebook", "youtube"],
              "approval": {
                  "required": True,
                  "approved": False
              },
              "automatic_publish": False,
              "artifact": "production/handmade-lesson-001/video/video.mp4"
          }
          Path("production/publishing_package.json").parent.mkdir(parents=True, exist_ok=True)
          Path("production/publishing_package.json").write_text(
              json.dumps(package, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Run real free factory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.free_factory import run_free_factory

          manifest = json.loads(Path("production-manifest.json").read_text(encoding="utf-8"))
          result = run_free_factory(manifest, Path("production"))
          Path("production/result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          validation = result["production"]["validation"]
          gate = result["publishing_gate"]

          print(json.dumps({
              "task_id": result["task_id"],
              "production_status": result["production"]["status"],
              "validation_status": validation["status"],
              "publish_ready": result["production"]["publish_ready"],
              "publishing_gate": gate,
          }, ensure_ascii=False, indent=2))

          if validation["status"] != "valid":
              raise SystemExit("Real production validation failed.")
          if not result["production"]["publish_ready"]:
              raise SystemExit("Production artifacts are not publish-ready.")
          if gate["publish_allowed"]:
              raise SystemExit("Publishing gate must remain blocked without human approval.")
          if gate["reason"] != "human_approval_required":
              raise SystemExit("Unexpected publishing gate reason.")

          package = json.loads(Path("production/publishing_package.json").read_text(encoding="utf-8"))
          if package["approval"]["approved"] is not False:
              raise SystemExit("Publishing package must start unapproved.")
          if package["automatic_publish"] is not False:
              raise SystemExit("Automatic publishing must remain disabled.")
          PY

      - name: Verify actual MP4 with ffprobe
        run: |
          VIDEO="production/handmade-lesson-001/video/video.mp4"
          test -s "$VIDEO"
          ffprobe -v error \
            -show_entries format=format_name,duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Write production evidence
        run: |
          mkdir -p production-evidence
          printf '%s\n' "Real free production evidence" > production-evidence/README.txt
          printf '%s\n' "Commit: $GITHUB_SHA" >> production-evidence/README.txt
          printf '%s\n' "Actual MP4: production/handmade-lesson-001/video/video.mp4" >> production-evidence/README.txt
          printf '%s\n' "Artifact validation: passed" >> production-evidence/README.txt
          printf '%s\n' "Publishing: blocked until explicit human approval" >> production-evidence/README.txt

      - name: Upload real production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-production-${{ github.run_id }}
          path: |
            production/
            production-manifest.json
            production-evidence/
          if-no-files-found: error
