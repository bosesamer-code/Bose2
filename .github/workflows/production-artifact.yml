name: production-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run regression tests
        run: |
          python -m pytest -q

      - name: Create real production manifest
        run: |
          cat > production-manifest.json <<'JSON'
          {
            "task_id": "github-actions-real-production-0001",
            "scene_plan": [
              {
                "scene": 1,
                "text": "درس هاند ميد مجاني: فكرة بسيطة يمكن تنفيذها في المنزل."
              }
            ],
            "inputs": {
              "script": "درس هاند ميد مجاني: فكرة بسيطة يمكن تنفيذها في المنزل.",
              "production_goal": "Create a valid local handmade lesson video artifact."
            }
          }
          JSON

      - name: Run real free factory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.free_factory import run_free_factory

          manifest = json.loads(Path("production-manifest.json").read_text(encoding="utf-8"))
          result = run_free_factory(manifest, Path("production"))
          Path("production/result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          validation = result["production"]["validation"]
          gate = result["publishing_gate"]

          print(json.dumps({
              "task_id": result["task_id"],
              "production_status": result["production"]["status"],
              "validation_status": validation["status"],
              "publish_ready": result["production"]["publish_ready"],
              "publishing_gate": gate,
          }, ensure_ascii=False, indent=2))

          if validation["status"] != "valid":
              raise SystemExit("Real production validation failed.")
          if not result["production"]["publish_ready"]:
              raise SystemExit("Production artifacts are not publish-ready.")
          if gate["publish_allowed"]:
              raise SystemExit("Publishing gate must remain blocked without human approval.")
          if gate["reason"] != "human_approval_required":
              raise SystemExit("Unexpected publishing gate reason.")
          PY

      - name: Verify actual MP4 with ffprobe
        run: |
          VIDEO="production/github-actions-real-production-0001/video/video.mp4"
          test -s "$VIDEO"
          ffprobe -v error \
            -show_entries format=format_name,duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Write production evidence
        run: |
          mkdir -p production-evidence
          printf '%s\n' "Real free production evidence" > production-evidence/README.txt
          printf '%s\n' "Commit: $GITHUB_SHA" >> production-evidence/README.txt
          printf '%s\n' "Actual MP4: production/github-actions-real-production-0001/video/video.mp4" >> production-evidence/README.txt
          printf '%s\n' "Artifact validation: passed" >> production-evidence/README.txt
          printf '%s\n' "Publishing: blocked until explicit human approval" >> production-evidence/README.txt

      - name: Upload real production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-production-${{ github.run_id }}
          path: |
            production/
            production-manifest.json
            production-evidence/
          if-no-files-found: error
