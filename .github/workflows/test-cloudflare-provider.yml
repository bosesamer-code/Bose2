name: Cloudflare image provider tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/cloudflare_image_provider.py"
      - "src/free_media_providers.py"
      - "tests/test_cloudflare_image_provider.py"
      - ".github/workflows/production-artifact.yml"
      - ".github/workflows/test-cloudflare-provider.yml"
  push:
    branches: ["integration/cloudflare-image-provider"]

permissions:
  contents: read

jobs:
  cloudflare-provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest edge-tts
      - name: Run provider tests without external API calls
        run: python -m pytest -q tests/test_cloudflare_image_provider.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
