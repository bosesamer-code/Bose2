name: automatic-publishing

on:
  workflow_run:
    workflows: ["production-artifact"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: automatic-publishing
  cancel-in-progress: false

jobs:
  publish:
    # Safe by default: with AUTO_PUBLISH_ENABLED unset/false, the job is skipped
    # cleanly before downloading artifacts or accessing publishing credentials.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.AUTO_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube publishing client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Download production artifact
        uses: actions/download-artifact@v5
        with:
          name: queued-production-${{ github.event.workflow_run.id }}
          path: published-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate every queued YouTube video before uploading
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packages = sorted(Path("published-input/production").glob("*/publishing_package.json"))
          if not packages:
              raise SystemExit("No publishing packages found; refusing to publish.")

          errors = []
          for package in packages:
              root = package.parent
              video = root / "video" / "video.mp4"
              try:
                  metadata = json.loads(package.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{package}: invalid JSON ({exc})")
                  continue
              if not video.is_file() or video.stat().st_size == 0:
                  errors.append(f"{video}: missing or empty")
              for field in ("title", "description"):
                  if not isinstance(metadata.get(field), str) or not metadata[field].strip():
                      errors.append(f"{package}: missing/empty {field}")
          if errors:
              print("\n".join(errors))
              raise SystemExit("Validation failed; no videos were uploaded.")
          print(f"Validated {len(packages)} video package(s).")
          PY
      - name: Prepare publishing evidence
        run: mkdir -p publishing-evidence
      - name: Upload lessons to verified YouTube channel as private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_HANDLE: handmade.secrets
          YOUTUBE_PRIVACY_STATUS: private
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in published-input/production/*/publishing_package.json; do
            root="$(dirname "$package")"
            video="$root/video/video.mp4"
            echo "Uploading $(basename "$root") to YouTube as private"
            python scripts/publish_youtube.py "$video" "$package" | tee -a publishing-evidence/uploads.jsonl
          done
      - name: Write publishing evidence
        if: always()
        run: |
          mkdir -p publishing-evidence
          printf '%s\n' "YouTube-only publishing workflow finished." > publishing-evidence/README.txt
          printf '%s\n' "Production run: ${{ github.event.workflow_run.id }}" >> publishing-evidence/README.txt
          printf '%s\n' "Privacy default: private" >> publishing-evidence/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publishing-evidence-${{ github.run_id }}
          path: publishing-evidence/
          if-no-files-found: warn
