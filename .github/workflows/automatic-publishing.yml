name: automatic-publishing

on:
  workflow_run:
    workflows: ["production-artifact"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: automatic-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing clients
        run: |
          python -m pip install --disable-pip-version-check requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Download production artifact
        uses: actions/download-artifact@v5
        with:
          name: queued-production-${{ github.event.workflow_run.id }}
          path: published-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check owner authorization
        env:
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED }}
        run: |
          test "$AUTO_PUBLISH_ENABLED" = "true" || {
            echo "Automatic publishing is disabled by the owner."
            exit 1
          }
      - name: Publish all generated lessons
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: v26.0
        run: |
          set -euo pipefail
          for package in published-input/production/*/publishing_package.json; do
            root="$(dirname "$package")"
            video="$root/video/video.mp4"
            echo "Publishing $(basename "$root")"
            python scripts/publish_youtube.py "$video" "$package"
            python scripts/publish_facebook.py "$video" "$package"
          done
      - name: Write publishing evidence
        run: |
          mkdir -p publishing-evidence
          printf '%s\n' "Automatic publishing completed." > publishing-evidence/README.txt
          printf '%s\n' "Production run: ${{ github.event.workflow_run.id }}" >> publishing-evidence/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: publishing-evidence-${{ github.run_id }}
          path: publishing-evidence/
