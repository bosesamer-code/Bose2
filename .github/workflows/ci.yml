name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "plan/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest edge-tts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run complete test suite
        run: python -m pytest -q
